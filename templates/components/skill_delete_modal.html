<button type="button" class="button button-danger skill-delete-button"
        popovertarget="delete-skill-{{ skill_id }}" aria-label="Hapus {{ skill_name }}">
    Hapus
</button>
<div id="delete-skill-{{ skill_id }}" class="project-delete-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="delete-skill-title-{{ skill_id }}">
    <button type="button" class="project-delete-modal__backdrop"
            popovertarget="delete-skill-{{ skill_id }}" popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close"
                popovertarget="delete-skill-{{ skill_id }}" popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-skill-title-{{ skill_id }}">Hapus Skill?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ skill_name }}</strong>?</p>
        <form data-delete-url="{% url 'api:skill-detail' skill_id %}" method="post" action="{% url 'main:delete_skill' skill_id %}">
            {% csrf_token %}
            <div class="project-delete-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="delete-skill-{{ skill_id }}" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
