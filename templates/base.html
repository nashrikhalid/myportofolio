{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience - {{ fullname }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>

                <a href="{% url 'main:show_main' %}#skills">Skills</a>
                <a href="{% url 'main:show_project' %}">Projects</a>
                <a href="{% url 'main:show_experience' %}">Experiences</a>
            </nav>
        </div>
    </header>

    <main>
        {% if messages %}
            <div class="container" style="padding-top: 1.5rem;">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" style="padding: 0.85rem 1.25rem; margin-bottom: 1rem; border-radius: var(--radius); background: {% if message.tags == 'error' %}rgba(180, 35, 24, 0.9){% else %}rgba(16, 185, 129, 0.9){% endif %}; color: white; font-weight: 500; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}

        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
