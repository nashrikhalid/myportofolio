{% extends 'base.html' %}
{% block content %}
    <section class="hero" id="home">
        <div class="container hero-grid">
            <div class="hero-identity">
                <h1>{{fullname}}</h1>
                <p class="hero-education">2nd Year Undergraduate Information Systems Student<br>Universitas Indonesia</p>
                <div class="interest-block">
                    <p class="hero-interest">Interest: Product Management, Data Analytics, and Data Engineering</p>
                </div>
                <div class="social-links">
                        <a href="https://github.com/nashrikhalid" class="social-link" aria-label="GitHub">
                            <i class="fa-brands fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/nashrikhalid" class="social-link" aria-label="LinkedIn">
                            <i class="fa-brands fa-linkedin"></i></a>
                        <a href="https://www.instagram.com/nashrikhlid" class="social-link" aria-label="Instagram">
                            <i class="fa-brands fa-instagram"></i></a>
                        <a href="mailto:nashrikhalid@gmail.com" class="social-link" aria-label="Mail">
                            <i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
            <div class="hero-photo">
                <img class="avatar" src="/static/img/portophoto1.png" alt="Photo of {{ name }}">
                <div class="meta-list glass-card">
                    <p>{{ npm }}<br>
                    PBP-F</p>
                </div>
            </div>
            <div class="hero-details">
                <h2 class="aboutme-heading">About me</h2>
                <p class="bio">{{bio}}</p>
            </div>
        </div>
    </section>
    {% include 'skills.html' %}
{% endblock %}
